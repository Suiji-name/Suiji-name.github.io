<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客 · 我的小世界</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { colors: { cream: '#FDFCF8', savor: '#F3EFE0' } } }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0c0a09; color: #f5f5f4; min-height: 100vh; }
    .font-serif { font-family: 'Playfair Display', serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1c1917; }
    ::-webkit-scrollbar-thumb { background: #44403c; border-radius: 3px; }

    .card { background: rgba(28,25,23,0.5); border: 1px solid rgba(255,255,255,0.05); border-radius: 1rem; transition: all 300ms; }
    .card:hover { border-color: rgba(255,255,255,0.1); }

    .toast { transform: translateY(100px); opacity: 0; transition: all 400ms cubic-bezier(0.16,1,0.3,1); }
    .toast.show { transform: translateY(0); opacity: 1; }

    .modal-bg { opacity: 0; pointer-events: none; transition: opacity 300ms; }
    .modal-bg.open { opacity: 1; pointer-events: all; }

    [contenteditable="true"] { outline: 2px dashed rgba(253,224,71,0.3); outline-offset: 4px; border-radius: 4px; }
    [contenteditable="true"]:focus { outline-color: rgba(253,224,71,0.6); background: rgba(253,224,71,0.03); }
    [contenteditable="true"] img {
      display: block; max-width: 100%; border-radius: 8px; margin: 12px 0; cursor: pointer;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .admin-pulse { animation: pulse 2s ease-in-out infinite; }

    .tag {
      display: inline-block; padding: 2px 10px; border-radius: 999px;
      background: rgba(253,224,71,0.08); color: rgba(253,224,71,0.7);
      font-size: 11px; font-weight: 500;
    }

    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    .shimmer {
      background: linear-gradient(90deg, #f5f5f4 0%, #fef3c7 25%, #f5f5f4 50%, #fef3c7 75%, #f5f5f4 100%);
      background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; animation: shimmer 6s linear infinite;
    }

    /* Post content styles */
    .post-content { font-size: 15px; line-height: 1.9; color: #d6d3d1; }
    .post-content p { margin-bottom: 1em; }
    .post-content img { max-width: 100%; border-radius: 12px; margin: 1.5em 0; }
    .post-content h2 { font-family: 'Playfair Display', serif; font-size: 1.5em; margin: 1.5em 0 0.5em; color: #f5f5f4; }
    .post-content h3 { font-family: 'Playfair Display', serif; font-size: 1.2em; margin: 1.2em 0 0.4em; color: #f5f5f4; }
    .post-content blockquote {
      border-left: 3px solid rgba(253,224,71,0.4); padding-left: 1em; margin: 1em 0;
      color: #a8a29e; font-style: italic;
    }
    .post-content code {
      background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px;
      font-size: 0.9em; font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .post-content pre {
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 1em 1.2em; overflow-x: auto; margin: 1em 0;
    }
    .post-content pre code { background: none; padding: 0; }
    .post-content a { color: #fbbf24; text-decoration: underline; text-underline-offset: 2px; }
    .post-content ul, .post-content ol { margin: 0.5em 0 0.5em 1.5em; }
    .post-content li { margin-bottom: 0.3em; }
    .post-content hr { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 2em 0; }
  </style>
</head>
<body class="antialiased">

<!-- Toast -->
<div id="toast" class="toast fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] bg-stone-800 border border-stone-700 text-stone-100 px-6 py-3 rounded-2xl text-sm font-medium shadow-2xl">
  <span id="toastMsg"></span>
</div>

<!-- Hidden file input for image upload -->
<input type="file" id="imgFileInput" accept="image/*" style="display:none" onchange="handleImgUpload(event)" />

<!-- Login Modal -->
<div id="loginModal" class="modal-bg fixed inset-0 z-[90] bg-black/70 backdrop-blur-md flex items-center justify-center">
  <div class="bg-stone-900 border border-stone-800 rounded-3xl p-8 w-full max-w-sm mx-4">
    <div class="text-center mb-6">
      <span class="text-4xl">🔐</span>
      <h3 class="font-serif text-2xl font-medium mt-3">管理员登录</h3>
      <p class="text-stone-500 text-sm mt-1">输入密码以进入编辑模式</p>
    </div>
    <input id="pwdInput" type="password" placeholder="输入密码..." class="w-full px-5 py-3 bg-white/5 border border-white/10 rounded-xl text-stone-100 placeholder:text-stone-600 outline-none focus:border-amber-500/50 transition-colors text-center text-lg mb-4" onkeydown="if(event.key==='Enter')tryLogin()" />
    <div class="flex gap-3">
      <button onclick="closeLogin()" class="flex-1 py-3 bg-white/5 border border-white/10 text-stone-400 rounded-xl hover:bg-white/10 transition-colors text-sm font-medium">取消</button>
      <button onclick="tryLogin()" class="flex-1 py-3 bg-stone-100 text-stone-950 rounded-xl hover:scale-105 transition-transform text-sm font-bold">登录</button>
    </div>
    <p id="loginErr" class="text-red-400 text-xs text-center mt-3 hidden">密码错误</p>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div id="deleteModal" class="modal-bg fixed inset-0 z-[90] bg-black/70 backdrop-blur-md flex items-center justify-center">
  <div class="bg-stone-900 border border-stone-800 rounded-3xl p-8 w-full max-w-sm mx-4 text-center">
    <span class="text-4xl">⚠️</span>
    <h3 class="font-serif text-xl font-medium mt-3">确认删除</h3>
    <p class="text-stone-500 text-sm mt-1">删除后无法恢复，确定要删除这篇文章吗？</p>
    <div class="flex gap-3 mt-6">
      <button onclick="closeDeleteModal()" class="flex-1 py-3 bg-white/5 border border-white/10 text-stone-400 rounded-xl hover:bg-white/10 transition-colors text-sm font-medium">取消</button>
      <button id="confirmDeleteBtn" class="flex-1 py-3 bg-red-600 text-white rounded-xl hover:bg-red-500 transition-colors text-sm font-bold">删除</button>
    </div>
  </div>
</div>

<!-- ========== NAV ========== -->
<nav class="fixed top-0 left-0 right-0 h-16 z-50 backdrop-blur-xl bg-stone-950/80 border-b border-white/5">
  <div class="max-w-4xl mx-auto h-full px-6 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <a href="https://suiji-name.github.io/" class="flex items-center gap-2 text-stone-400 hover:text-stone-200 transition-colors select-none">
        <span class="text-xl">🐱</span>
        <span class="font-serif text-sm font-medium hidden sm:inline">我的小世界</span>
      </a>
      <span class="text-stone-700">/</span>
      <span class="font-serif text-lg font-medium shimmer">博客</span>
    </div>
    <div class="flex items-center gap-3">
      <div id="adminBadge" class="hidden items-center gap-1.5 px-3 py-1 rounded-full bg-amber-500/20 border border-amber-500/30">
        <span class="w-2 h-2 rounded-full bg-amber-400 admin-pulse"></span>
        <span class="text-amber-400 text-xs font-bold">编辑中</span>
      </div>
      <button id="adminBtn" onclick="toggleAdmin()" class="w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-stone-500 hover:text-stone-300 hover:bg-white/10 transition-all" title="管理员模式 (Ctrl+Shift+A)">
        <span class="iconify text-lg" data-icon="mdi:shield-lock-outline"></span>
      </button>
    </div>
  </div>
</nav>

<!-- ========== MAIN CONTENT ========== -->
<main class="pt-20 pb-24 px-6 min-h-screen" id="mainContent"></main>

<!-- ========== FOOTER ========== -->
<footer class="border-t border-white/5 py-8 px-6">
  <div class="max-w-4xl mx-auto text-center">
    <p class="text-stone-600 text-xs">&copy; 2024 我的小世界 · 博客</p>
  </div>
</footer>

<script>
// ==================== CONFIG ====================
const ADMIN_PASSWORD = 'maonv'; // ← 与主站保持一致
const SAVE_KEY = 'myBlogPosts';

// ==================== DEFAULT DATA ====================
const DEFAULT_POSTS = [
  {
    id: 1,
    title: '我的第一篇博客',
    content: '<p>欢迎来到我的博客！</p><p>在这里我会分享一些有趣的想法、技术笔记和生活感悟。</p><p>希望你能在这里找到一些有价值的东西 ✨</p>',
    date: '2024.12.20',
    tags: ['随笔'],
    excerpt: '欢迎来到我的博客！在这里我会分享一些有趣的想法、技术笔记和生活感悟。'
  },
  {
    id: 2,
    title: '使用 CSS Grid 构建响应式布局',
    content: '<p>CSS Grid 是现代网页布局的利器。相比 Flexbox 的一维布局，Grid 提供了真正的二维布局能力。</p><h3>基本概念</h3><p>Grid 由容器（container）和项目（item）组成。通过 <code>grid-template-columns</code> 和 <code>grid-template-rows</code> 定义网格结构。</p><h3>实用技巧</h3><p>使用 <code>auto-fill</code> 和 <code>minmax()</code> 可以轻松实现响应式卡片布局，无需媒体查询。</p><pre><code>.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }</code></pre><p>这个技巧在实际项目中非常实用，建议多加练习。</p>',
    date: '2024.12.18',
    tags: ['技术', 'CSS'],
    excerpt: 'CSS Grid 是现代网页布局的利器。相比 Flexbox 的一维布局，Grid 提供了真正的二维布局能力。'
  },
  {
    id: 3,
    title: '冬日读书笔记：三体',
    content: '<p>花了整整一个月，终于读完了刘慈欣的《三体》三部曲。</p><p>黑暗森林法则令人震撼——宇宙就是一座黑暗森林，每个文明都是带枪的猎人。在浩瀚的宇宙面前，人类文明不过是沧海一粟。</p><blockquote>给岁月以文明，而不是给文明以岁月。</blockquote><p>这句话让我思考了很久。文明的意义不在于存续多久，而在于是否真正活过。</p>',
    date: '2024.12.10',
    tags: ['读书', '随想'],
    excerpt: '花了整整一个月，终于读完了刘慈欣的《三体》三部曲。黑暗森林法则令人震撼。'
  },
];

// ==================== STATE ====================
let isAdmin = false;
let posts = [];
let pendingDeleteId = null;
let activeEditableEl = null;

// ==================== DATA ====================
function load() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    posts = s ? JSON.parse(s) : JSON.parse(JSON.stringify(DEFAULT_POSTS));
  } catch { posts = JSON.parse(JSON.stringify(DEFAULT_POSTS)); }
}
function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(posts)); }

// ==================== ROUTING ====================
function getHash() {
  const h = window.location.hash.slice(1) || 'list';
  return h;
}

function navigate(hash) {
  window.location.hash = hash;
}

function route() {
  const h = getHash();
  const main = document.getElementById('mainContent');

  if (h === 'list') renderList(main);
  else if (h === 'new') renderEditor(main, null);
  else if (h.startsWith('post/')) {
    const id = parseInt(h.split('/')[1]);
    const post = posts.find(p => p.id === id);
    if (post) renderPost(main, post);
    else { navigate('list'); return; }
  }
  else if (h.startsWith('edit/')) {
    const id = parseInt(h.split('/')[1]);
    const post = posts.find(p => p.id === id);
    if (post) renderEditor(main, post);
    else { navigate('list'); return; }
  }
  else navigate('list');

  updateAdmin();
}

window.addEventListener('hashchange', route);

// ==================== RENDER: LIST ====================
function renderList(main) {
  const searchQuery = new URLSearchParams(window.location.search).get('q') || '';
  let filtered = posts;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = posts.filter(p =>
      p.title.toLowerCase().includes(q) ||
      p.tags.some(t => t.toLowerCase().includes(q)) ||
      p.excerpt.toLowerCase().includes(q)
    );
  }

  main.innerHTML = `
    <div class="max-w-3xl mx-auto">
      <!-- Header -->
      <div class="mb-10">
        <h1 class="font-serif text-4xl md:text-5xl font-normal shimmer mb-3">博客</h1>
        <p class="text-stone-500 font-light">共 ${posts.length} 篇文章</p>
      </div>

      <!-- Search & Actions -->
      <div class="flex items-center gap-3 mb-8">
        <div class="flex-1 relative">
          <span class="iconify absolute left-3 top-1/2 -translate-y-1/2 text-stone-600" data-icon="mdi:magnify"></span>
          <input id="searchInput" type="text" placeholder="搜索文章…" value="${searchQuery.replace(/"/g,'&quot;')}"
            class="w-full pl-10 pr-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-stone-200 placeholder:text-stone-600 outline-none focus:border-amber-500/30 transition-colors text-sm"
            onkeydown="if(event.key==='Enter')search()" />
        </div>
        ${isAdmin ? `
          <button onclick="navigate('new')" class="shrink-0 flex items-center gap-1.5 px-4 py-2.5 bg-amber-500/20 border border-amber-500/30 text-amber-400 rounded-xl hover:bg-amber-500/30 transition-colors text-sm font-medium">
            <span class="iconify" data-icon="mdi:plus"></span>
            <span class="hidden sm:inline">写文章</span>
          </button>
        ` : ''}
      </div>

      <!-- Post List -->
      <div class="space-y-4">
        ${filtered.length === 0 ? `
          <div class="card p-12 text-center">
            <span class="text-4xl">📭</span>
            <p class="text-stone-500 mt-4">${searchQuery ? '没有找到匹配的文章' : '还没有文章'}</p>
            ${isAdmin ? `<button onclick="navigate('new')" class="mt-4 text-amber-400 hover:underline text-sm">写第一篇博客 →</button>` : ''}
          </div>
        ` : filtered.map(p => `
          <article class="card p-6 cursor-pointer group" onclick="navigate('post/${p.id}')">
            <div class="flex items-start justify-between gap-4">
              <div class="flex-1 min-w-0">
                <h2 class="font-serif text-xl font-medium text-stone-200 group-hover:text-amber-400 transition-colors mb-2">${p.title}</h2>
                <p class="text-stone-500 text-sm font-light line-clamp-2 mb-3">${p.excerpt}</p>
                <div class="flex items-center gap-3 flex-wrap">
                  <span class="text-stone-600 text-xs">${p.date}</span>
                  <div class="flex gap-1.5 flex-wrap">
                    ${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                  </div>
                </div>
              </div>
              ${isAdmin ? `
                <div class="flex items-center gap-1 shrink-0" onclick="event.stopPropagation()">
                  <button class="w-7 h-7 rounded-lg bg-white/5 text-stone-500 hover:text-stone-300 hover:bg-white/10 flex items-center justify-center transition-colors" onclick="navigate('edit/${p.id}')" title="编辑">
                    <span class="iconify text-sm" data-icon="mdi:pencil"></span>
                  </button>
                  <button class="w-7 h-7 rounded-lg bg-red-500/10 text-red-400 hover:bg-red-500/20 flex items-center justify-center transition-colors" onclick="openDeleteModal(${p.id})" title="删除">
                    <span class="iconify text-sm" data-icon="mdi:delete-outline"></span>
                  </button>
                </div>
              ` : ''}
            </div>
          </article>
        `).join('')}
      </div>
    </div>
  `;
}

function search() {
  const q = document.getElementById('searchInput').value.trim();
  if (q) window.location.search = '?q=' + encodeURIComponent(q);
  else window.location.search = '';
}

// ==================== RENDER: POST ====================
function renderPost(main, post) {
  main.innerHTML = `
    <div class="max-w-2xl mx-auto">
      <!-- Back -->
      <button onclick="navigate('list')" class="flex items-center gap-1.5 text-stone-500 hover:text-stone-300 transition-colors mb-8 text-sm">
        <span class="iconify" data-icon="mdi:arrow-left"></span>
        <span>返回列表</span>
      </button>

      <!-- Post Header -->
      <header class="mb-10">
        <h1 class="font-serif text-3xl md:text-4xl font-normal leading-tight mb-4">${post.title}</h1>
        <div class="flex items-center gap-4 flex-wrap">
          <span class="text-stone-500 text-sm">${post.date}</span>
          <div class="flex gap-1.5 flex-wrap">${post.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        </div>
      </header>

      <!-- Post Content -->
      <div class="post-content">${post.content}</div>

      <!-- Admin Actions -->
      ${isAdmin ? `
        <div class="mt-12 pt-8 border-t border-white/5 flex gap-3">
          <button onclick="navigate('edit/${post.id}')" class="flex items-center gap-1.5 px-4 py-2.5 bg-white/5 border border-white/10 text-stone-300 rounded-xl hover:bg-white/10 transition-colors text-sm font-medium">
            <span class="iconify" data-icon="mdi:pencil"></span> 编辑
          </button>
          <button onclick="openDeleteModal(${post.id})" class="flex items-center gap-1.5 px-4 py-2.5 bg-red-500/10 border border-red-500/20 text-red-400 rounded-xl hover:bg-red-500/20 transition-colors text-sm font-medium">
            <span class="iconify" data-icon="mdi:delete-outline"></span> 删除
          </button>
        </div>
      ` : ''}
    </div>
  `;
}

// ==================== RENDER: EDITOR ====================
function renderEditor(main, post) {
  const isNew = !post;
  const p = post || { id: Date.now(), title: '', content: '', tags: [], date: today(), excerpt: '' };

  main.innerHTML = `
    <div class="max-w-2xl mx-auto">
      <!-- Back -->
      <button onclick="${isNew ? "navigate('list')" : `navigate('post/${p.id}')`}" class="flex items-center gap-1.5 text-stone-500 hover:text-stone-300 transition-colors mb-8 text-sm">
        <span class="iconify" data-icon="mdi:arrow-left"></span>
        <span>${isNew ? '返回列表' : '返回文章'}</span>
      </button>

      <!-- Editor -->
      <div class="space-y-6">
        <!-- Title -->
        <div>
          <label class="block text-stone-500 text-xs uppercase tracking-wider mb-2">标题</label>
          <input id="editTitle" type="text" value="${p.title.replace(/"/g,'&quot;')}" placeholder="输入文章标题…"
            class="w-full px-0 py-2 bg-transparent border-0 border-b border-white/10 text-stone-100 text-2xl font-serif placeholder:text-stone-700 outline-none focus:border-amber-500/50 transition-colors" />
        </div>

        <!-- Tags -->
        <div>
          <label class="block text-stone-500 text-xs uppercase tracking-wider mb-2">标签（用逗号分隔）</label>
          <input id="editTags" type="text" value="${p.tags.join(', ')}" placeholder="例如：技术, CSS, 教程"
            class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-stone-200 placeholder:text-stone-600 outline-none focus:border-amber-500/30 transition-colors text-sm" />
        </div>

        <!-- Content -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="text-stone-500 text-xs uppercase tracking-wider">内容</label>
            <div class="flex items-center gap-2">
              <span class="text-stone-600 text-xs">支持粘贴图片</span>
              <button onclick="openImgUpload(document.getElementById('editContent'))" class="flex items-center gap-1 px-2 py-1 rounded-lg bg-white/5 border border-white/10 text-stone-500 hover:text-stone-300 hover:bg-white/10 transition-colors text-xs" title="上传图片">
                <span class="iconify text-sm" data-icon="mdi:image-plus-outline"></span>
              </button>
            </div>
          </div>
          <div id="editContent" contenteditable="true"
            class="w-full min-h-[300px] p-5 bg-white/[0.02] border border-white/10 rounded-xl text-stone-300 font-light leading-relaxed outline-none focus:border-amber-500/30 transition-colors post-content"
            placeholder="开始写你的博客…">${p.content}</div>
        </div>

        <!-- Actions -->
        <div class="flex gap-3 pt-4">
          <button onclick="savePost(${p.id}, ${isNew})" class="flex-1 py-3 bg-stone-100 text-stone-950 rounded-xl hover:scale-105 transition-transform text-sm font-bold">
            ${isNew ? '发布文章' : '保存修改'}
          </button>
          <button onclick="${isNew ? "navigate('list')" : `navigate('post/${p.id}')`}" class="px-6 py-3 bg-white/5 border border-white/10 text-stone-400 rounded-xl hover:bg-white/10 transition-colors text-sm font-medium">
            取消
          </button>
        </div>
      </div>
    </div>
  `;

  // Focus title for new posts
  if (isNew) {
    setTimeout(() => document.getElementById('editTitle').focus(), 200);
  }
}

// ==================== SAVE POST ====================
function savePost(id, isNew) {
  const title = document.getElementById('editTitle').value.trim();
  const content = document.getElementById('editContent').innerHTML;
  const tagsRaw = document.getElementById('editTags').value.trim();

  if (!title) { toast('请输入标题'); return; }
  if (!content || content === '<br>' || content === '<br>' ) { toast('请输入内容'); return; }

  const tags = tagsRaw ? tagsRaw.split(/[,，]/).map(t => t.trim()).filter(Boolean) : [];
  const excerpt = document.getElementById('editContent').innerText.slice(0, 120).replace(/\n/g, ' ').trim();

  if (isNew) {
    posts.unshift({
      id: Date.now(),
      title,
      content,
      tags,
      date: today(),
      excerpt: excerpt || '(空文章)'
    });
  } else {
    const p = posts.find(x => x.id === id);
    if (!p) return;
    p.title = title;
    p.content = content;
    p.tags = tags;
    p.excerpt = excerpt || '(空文章)';
  }

  save();
  toast(isNew ? '文章已发布 🎉' : '文章已保存 ✅');
  navigate(isNew ? 'list' : 'post/' + id);
}

// ==================== DELETE ====================
function openDeleteModal(id) {
  pendingDeleteId = id;
  document.getElementById('deleteModal').classList.add('open');
}
function closeDeleteModal() {
  pendingDeleteId = null;
  document.getElementById('deleteModal').classList.remove('open');
}
document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
  if (pendingDeleteId !== null) {
    posts = posts.filter(p => p.id !== pendingDeleteId);
    save();
    closeDeleteModal();
    toast('文章已删除');
    navigate('list');
  }
});

// ==================== IMAGE PASTE & UPLOAD ====================
document.addEventListener('focusin', function(e) {
  if (e.target.isContentEditable) activeEditableEl = e.target;
});

document.addEventListener('paste', function(e) {
  if (!isAdmin) return;
  const target = e.target;
  if (!target.isContentEditable) return;
  const items = e.clipboardData.items;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      insertImageFromBlob(item.getAsFile(), target);
      return;
    }
  }
});

function handleImgUpload(e) {
  const file = e.target.files[0];
  if (!file || !activeEditableEl) return;
  insertImageFromBlob(file, activeEditableEl);
  e.target.value = '';
}

function openImgUpload(el) {
  activeEditableEl = el;
  document.getElementById('imgFileInput').click();
}

function insertImageFromBlob(blob, target) {
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const maxW = 800;
      let w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

      const imgEl = document.createElement('img');
      imgEl.src = dataUrl;

      target.focus();
      const sel = window.getSelection();
      if (sel.rangeCount) {
        const range = sel.getRangeAt(0);
        range.deleteContents();
        range.insertNode(imgEl);
        const br = document.createElement('br');
        range.setStartAfter(imgEl);
        range.collapse(true);
        range.insertNode(br);
        range.setStartAfter(br);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      }
      toast('图片已插入 ✅');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(blob);
}

// ==================== ADMIN MODE ====================
function toggleAdmin() { isAdmin ? logoutAdmin() : openLogin(); }

function openLogin() {
  document.getElementById('loginModal').classList.add('open');
  document.getElementById('pwdInput').value = '';
  document.getElementById('loginErr').classList.add('hidden');
  setTimeout(() => document.getElementById('pwdInput').focus(), 200);
}
function closeLogin() { document.getElementById('loginModal').classList.remove('open'); }

function tryLogin() {
  if (document.getElementById('pwdInput').value === ADMIN_PASSWORD) {
    isAdmin = true; closeLogin(); updateAdmin(); route();
    toast('欢迎回来，管理员 🐱');
  } else {
    document.getElementById('loginErr').classList.remove('hidden');
  }
}
function logoutAdmin() { isAdmin = false; updateAdmin(); route(); toast('已退出编辑模式'); }

function updateAdmin() {
  const badge = document.getElementById('adminBadge');
  const btn = document.getElementById('adminBtn');

  if (isAdmin) {
    badge.classList.remove('hidden'); badge.classList.add('flex');
    btn.classList.add('!bg-amber-500/20','!border-amber-500/30','!text-amber-400');
    btn.querySelector('.iconify').setAttribute('data-icon','mdi:shield-lock');
  } else {
    badge.classList.add('hidden'); badge.classList.remove('flex');
    btn.classList.remove('!bg-amber-500/20','!border-amber-500/30','!text-amber-400');
    btn.querySelector('.iconify').setAttribute('data-icon','mdi:shield-lock-outline');
  }
}

// ==================== UTILITIES ====================
function today() { return new Date().toISOString().slice(0,10).replace(/-/g,'.'); }

let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2000);
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.shiftKey && e.key === 'A') { e.preventDefault(); toggleAdmin(); }
  if (e.key === 'Escape') { closeLogin(); closeDeleteModal(); }
});

// ==================== INIT ====================
load();
route();
</script>
